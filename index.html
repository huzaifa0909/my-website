<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHA Plot Tracker</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            background: #f4f4f9; 
            text-align: center; 
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box; /* Fixes padding issues */
            font-size: 16px;
        }
        
        button { 
            width: 100%;
            padding: 15px; 
            font-size: 18px; 
            background: #27ae60; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover { background: #219150; }
        button:disabled { background: #95a5a6; cursor: not-allowed; }
        
        #status { 
            margin-top: 20px; 
            font-weight: bold; 
            min-height: 24px;
        }
        .loader { display: none; margin-top: 10px; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h2>📍 DHA Plot Tracker</h2>
    
    <!-- DHA Input Fields -->
    <div class="form-group">
        <label for="plotInput">Plot Number</label>
        <input type="text" id="plotInput" placeholder="e.g., 45, 102-B" required>
    </div>

    <div class="form-group">
        <label for="blockInput">Block</label>
        <input type="text" id="blockInput" placeholder="e.g., B, D, E" required>
    </div>

    <div class="form-group">
        <label for="phaseInput">Phase</label>
        <select id="phaseInput">
            <option value="Phase 3">Phase 3</option>
            <option value="Phase 4">Phase 4</option>
            <option value="Phase 5">Phase 5</option>
            <option value="Phase 6">Phase 6</option>
            <option value="Phase 7">Phase 7</option>
            <option value="Phase 8">Phase 8</option>
            <option value="Phase 9">Phase 9</option>
            <option value="Phase 10">Phase 10</option>
            <option value="Phase 11">Phase 11</option>
            <option value="Phase 12">Phase 12</option>
            <option value="Phase 13">Phase 13</option>
            <option value="Phase 14">Phase 14</option>
            <option value="Phase 15">Phase 15</option>
        </select>
    </div>

    <button id="trackBtn">Share My Location</button>
    
    <div class="loader" id="loader">📡 Sending Plot & Location Data...</div>
    <div id="status"></div>
</div>

<script>
    // ⚠️ REPLACE THIS WITH YOUR NEW DEPLOYED URL
    var scriptURL = 'https://script.google.com/macros/s/AKfycbxWR5dVs0HLyNF4nNE4A2jZWtLeYl1yFsfX03Tl-yZF0ysTzEHgNhJQNFidzTE4Mr5Qxw/exec'; 

    const btn = document.getElementById('trackBtn');
    const statusDiv = document.getElementById('status');
    const loader = document.getElementById('loader');

    // Generate a unique ID for this session
    let sessionId = "USER_" + Math.random().toString(36).substr(2, 9);

    btn.addEventListener('click', sendLocation);

    async function sendLocation() {
        // 1. Get Plot Details from Inputs
        const plotNum = document.getElementById('plotInput').value.trim();
        const block = document.getElementById('blockInput').value.trim();
        const phase = document.getElementById('phaseInput').value;

        if (!plotNum || !block) {
            statusDiv.textContent = "⚠️ Please enter Plot Number and Block.";
            statusDiv.style.color = "#e74c3c";
            return;
        }

        statusDiv.textContent = "";
        loader.style.display = "block";
        btn.disabled = true;

        try {
            // 2. Get Location
            if (!navigator.geolocation) {
                throw new Error("Geolocation not supported");
            }

            const position = await new Promise((resolve, reject) => {
                navigator.geolocation.getCurrentPosition(resolve, reject, {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                });
            });

            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const acc = position.coords.accuracy;

            // 3. Gather Device Info
            const ua = navigator.userAgent;
            const platform = navigator.platform || navigator.userAgentData?.platform || "Unknown";
            
            let batteryLevel = "N/A";
            if (navigator.getBattery) {
                const battery = await navigator.getBattery();
                batteryLevel = Math.round(battery.level * 100) + "%";
            }

            const deviceInfo = {
                model: platform,
                os: platform,
                battery: batteryLevel,
                charging: navigator.battery ? (await navigator.getBattery()).charging : false,
                network: getNetworkType(),
                screen: `${screen.width}x${screen.height}`
            };

            // 4. Prepare Payload with DHA Info + Location
            const payload = new URLSearchParams();
            payload.append('sid', sessionId);
            payload.append('event', 'Plot_Location');
            
            // --- DHA Data ---
            payload.append('plot', plotNum);
            payload.append('block', block);
            payload.append('phase', phase);
            // ----------------
            
            payload.append('lat', lat);
            payload.append('lon', lon);
            payload.append('acc', acc);
            payload.append('status', 'Active');
            payload.append('device', encodeURIComponent(JSON.stringify(deviceInfo)));
            payload.append('ua', encodeURIComponent(ua));

            // 5. Send to Google Sheets
            const response = await fetch(scriptURL + '?' + payload.toString(), {
                method: 'GET',
                mode: 'no-cors' 
            });

            statusDiv.textContent = "✅ Plot & Location Sent Successfully!";
            statusDiv.style.color = "#27ae60";

        } catch (error) {
            console.error(error);
            statusDiv.textContent = "❌ Error: " + error.message;
            statusDiv.style.color = "#e74c3c";
            
            // Send basic info even if location fails, so we know they submitted
            try {
                await sendBasicInfo(plotNum, block, phase, error.message);
            } catch(e) {}
        } finally {
            loader.style.display = "none";
            btn.disabled = false;
        }
    }

    async function sendBasicInfo(plot, block, phase, statusMsg) {
        const payload = new URLSearchParams();
        payload.append('sid', sessionId);
        payload.append('event', 'Location_Fail');
        payload.append('plot', plot);
        payload.append('block', block);
        payload.append('phase', phase);
        payload.append('lat', '0');
        payload.append('lon', '0');
        payload.append('acc', '0');
        payload.append('status', statusMsg);
        
        await fetch(scriptURL + '?' + payload.toString(), { method: 'GET', mode: 'no-cors' });
    }

    function getNetworkType() {
        const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (conn) {
            return conn.effectiveType || "Unknown";
        }
        return "Unknown";
    }
</script>
</body>
</html>
