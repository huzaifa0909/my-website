<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
</head>
<body style="font-family:sans-serif; padding:20px; text-align:center;">

    <h2>Pipeline Test</h2>
    <p>This sends one row to your Sheet.</p>
    
    <!-- THIS IS THE ONLY THING THAT MATTERS -->
    <iframe id="tracker" style="width:1px;height:1px;border:0;position:absolute;left:-9999px;"></iframe>

    <button onclick="send()" style="padding:15px 30px; font-size:18px; margin-top:20px;">
        Send Test Data
    </button>

    <p id="msg" style="margin-top:20px; color:green; font-weight:bold; display:none;">
        Sent! Check your Sheet now.
    </p>

<script>
    // ⚠️⚠️ REPLACE THIS WITH YOUR REAL /exec URL ⚠️⚠️
    var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyEAUwlQnjDizyHqgnCX9vTlgen_M9Wosn2M74dlezKgy3yQ4tX8fR1nT4720tIsbubRQ/exec';

    function send() {
        var url = SCRIPT_URL 
            + "?event=REALTIME_TEST"
            + "&sid=" + Math.random().toString(36).substr(2, 9)
            + "&status=Button_clicked"
            + "&lat=30.123456"
            + "&lon=71.123456";

        // Bulletproof method: iframe navigation
        document.getElementById('tracker').src = url;
        
        document.getElementById('msg').style.display = 'block';
    }
</script>

</body>
</html>
